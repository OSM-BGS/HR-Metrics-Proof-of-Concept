<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HR Catalogue - Diagnostic Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }</style>
</head>
<body>

    <div id="debugConsole" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded shadow-lg">
        <p class="font-bold">⚠️ System Check Failed:</p>
        <ul id="errorList" class="list-disc ml-5 mt-2 text-sm font-mono"></ul>
    </div>

    <div id="appView" class="hidden flex h-[90vh] border border-gray-300 bg-white shadow-xl rounded-lg overflow-hidden">
        <aside class="w-80 border-r bg-gray-50 flex flex-col">
            <div class="p-3 border-b font-bold text-gray-600">Capabilities</div>
            <div id="treeRoot" class="flex-1 overflow-auto p-2 space-y-1"></div>
        </aside>
        <main class="flex-1 p-8 overflow-auto">
            <h1 id="detTitle" class="text-2xl font-bold mb-4 text-gray-800">Select a Capability</h1>
            <div id="detContent"></div>
            <table class="w-full mt-6 text-sm text-left border hidden" id="detTable">
                <thead class="bg-gray-100 uppercase text-xs">
                    <tr><th class="p-3 border">Benefit</th><th class="p-3 border">Metric</th><th class="p-3 border">Formula</th></tr>
                </thead>
                <tbody id="detTableBody"></tbody>
            </table>
        </main>
    </div>

    <script>
        // === DIAGNOSTIC LOGIC ===
        function reportError(msg) {
            document.getElementById('debugConsole').classList.remove('hidden');
            const li = document.createElement('li');
            li.textContent = msg;
            document.getElementById('errorList').appendChild(li);
        }

        async function init() {
            // 1. Check if files exist
            const files = ['data/capabilities.csv', 'data/benefits.csv', 'data/metrics.csv'];
            const datasets = {};

            for (const path of files) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) {
                        reportError(`FILE MISSING: Could not find "${path}". Check spelling and capitalization exactly.`);
                        return; // Stop if file missing
                    }
                    const text = await response.text();
                    
                    // Parse
                    const result = Papa.parse(text, { header: true, skipEmptyLines: true });
                    
                    if (result.errors.length > 0) {
                        reportError(`CSV ERROR in ${path}: ${result.errors[0].message}`);
                    }
                    
                    // Verify Headers
                    const headers = result.meta.fields;
                    const fileName = path.split('/')[1];
                    datasets[fileName] = result.data;

                    // Header Validation Checks
                    if (fileName === 'capabilities.csv') {
                        if (!headers.includes('CapabilityID') && !headers.includes('Capability ID')) 
                            reportError(`HEADER ERROR: capabilities.csv is missing "CapabilityID" column.`);
                        if (!headers.includes('CapabilityName') && !headers.includes('Capability Name')) 
                            reportError(`HEADER ERROR: capabilities.csv is missing "CapabilityName" column.`);
                    }
                    
                    if (fileName === 'benefits.csv' && !headers.includes('BenefitStatement')) 
                        reportError(`HEADER ERROR: benefits.csv is missing "BenefitStatement" column.`);

                } catch (e) {
                    reportError(`NETWORK ERROR: ${e.message}`);
                    return;
                }
            }

            // If we get here, data is safe. Launch App.
            launchApp(datasets);
        }

        // === APP LOGIC ===
        function launchApp(data) {
            document.getElementById('appView').classList.remove('hidden');
            
            const caps = data['capabilities.csv'];
            const bens = data['benefits.csv'];
            const mets = data['metrics.csv'];

            // Index Metrics
            const metMap = {};
            mets.forEach(m => {
                // Try variations of ID
                const id = m.MetricID || m['MetricID*'] || m['Metric ID'];
                if(id) metMap[id] = m;
            });

            // Build Tree
            const treeRoot = document.getElementById('treeRoot');
            
            // Sort
            caps.sort((a,b) => (a.CapabilityID || a['Capability ID']).localeCompare(b.CapabilityID || b['Capability ID'], undefined, {numeric:true}));

            caps.forEach(c => {
                const id = c.CapabilityID || c['Capability ID'];
                const name = c.CapabilityName || c['Capability Name'];
                
                // Only showing items with IDs for sanity
                if (!id) return;

                const div = document.createElement('div');
                div.className = "cursor-pointer hover:bg-blue-100 p-2 rounded text-sm";
                div.textContent = `${id} - ${name}`;
                div.onclick = () => showDetails(c, bens, metMap);
                treeRoot.appendChild(div);
            });
        }

        function showDetails(cap, allBens, metMap) {
            const id = cap.CapabilityID || cap['Capability ID'];
            const name = cap.CapabilityName || cap['Capability Name'];
            
            document.getElementById('detTitle').textContent = `${id} - ${name}`;
            document.getElementById('detContent').textContent = cap.Description || "No description.";
            
            const tbody = document.getElementById('detTableBody');
            tbody.innerHTML = '';
            document.getElementById('detTable').classList.remove('hidden');

            const myBens = allBens.filter(b => b.CapabilityID === id);

            if (myBens.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-3 text-gray-500 italic">No direct metrics found.</td></tr>';
                return;
            }

            myBens.forEach(b => {
                const mID = b.LinkedMetricID;
                const metric = metMap[mID] || {};
                const mName = metric.MetricName || metric['MetricName*'] || mID;
                const mForm = metric.CalcFormula || metric.CalcMethod || "-";

                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3">${b.BenefitStatement}</td>
                        <td class="p-3 font-bold text-blue-700">${mName}</td>
                        <td class="p-3 font-mono text-xs bg-gray-50">${mForm}</td>
                    </tr>
                `;
            });
        }

        init();
    </script>
</body>
</html>
